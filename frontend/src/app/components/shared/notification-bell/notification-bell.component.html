<div class="notification-bell-container">
  <!-- Bell Icon -->
  <button
    class="btn btn-link notification-bell"
    (click)="toggleDropdown()"
    title="Notifications"
  >
    <span class="bell-icon">🔔</span>
    <span *ngIf="unreadCount > 0" class="badge badge-danger">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Menu -->
  <div *ngIf="showDropdown" class="notification-dropdown" (clickOutside)="closeDropdown()">
    <!-- Header -->
    <div class="notification-header">
      <h6 class="mb-0">Notifications</h6>
      <button
        *ngIf="unreadCount > 0"
        class="btn btn-sm btn-link"
        (click)="markAllAsRead()"
        title="Mark all as read"
      >
        ✓ Mark all read
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="notification-body text-center py-3">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="notification-body text-center py-3">
      <small class="text-danger">{{ error }}</small>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && notifications.length === 0 && !error" class="notification-body text-center py-3">
      <small class="text-muted">No notifications</small>
    </div>

    <!-- Notifications List -->
    <div *ngIf="!loading && notifications.length > 0" class="notification-body">
      <div
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="!notification.isRead"
        (click)="markAsRead(notification)"
      >
        <div class="notification-content">
          <div class="notification-header-row">
            <span class="notification-icon">{{ getNotificationIcon(notification.type) }}</span>
            <h6 class="notification-title mb-0">{{ notification.title }}</h6>
            <button
              class="btn btn-sm btn-link text-danger"
              (click)="deleteNotification(notification); $event.stopPropagation()"
              title="Delete notification"
            >
              ✕
            </button>
          </div>
          <p class="notification-message mb-1">{{ notification.message }}</p>
          <small class="notification-time text-muted">
            {{ notification.createdAt | date:'short' }}
          </small>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="notification-footer">
      <a href="#" class="btn btn-sm btn-link w-100">View All Notifications</a>
    </div>
  </div>
</div>
